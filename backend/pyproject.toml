[project]
name = "matchbook"
version = "0.1.0"
description = "Exception resolution agent for Ramp Bill Pay (hackathon demo)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "anthropic>=2.6",
  "mcp>=2.3",
  "reportlab>=5.1",
  "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "playwright>=1.64.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "../evals"]
pythonpath = ["."]
